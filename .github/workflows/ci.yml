name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this plugin
        uses: actions/checkout@v4
        with:
          path: OpenClawProvider

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        working-directory: OpenClawProvider
        run: pnpm install --frozen-lockfile

      - name: Verify complete catalog projections
        working-directory: OpenClawProvider
        run: pnpm sync-catalog:check && pnpm sync-services:check

      - name: Typecheck
        working-directory: OpenClawProvider
        run: pnpm typecheck

      - name: Unit tests
        working-directory: OpenClawProvider
        run: pnpm test

      - name: Build
        working-directory: OpenClawProvider
        run: pnpm build

      - name: Check package
        working-directory: OpenClawProvider
        run: pnpm pack --pack-destination .

      - name: Inspect packed plugin on the build SDK host
        working-directory: OpenClawProvider
        env:
          OPENCLAW_HOME: ${{ runner.temp }}/provider-home
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/provider-state
          OPENCLAW_CONFIG_PATH: ${{ runner.temp }}/provider-state/openclaw.json
        run: |
          package_version=$(node -p "require('./package.json').version")
          pnpm exec openclaw plugins install "npm-pack:$PWD/acedatacloud-openclaw-provider-${package_version}.tgz" --force --accept-capabilities
          pnpm exec openclaw plugins inspect acedatacloud --runtime --json > runtime-inspect.json
          node scripts/check-runtime.mjs runtime-inspect.json

      - name: Install current stable compatibility host
        run: npm install --prefix "$RUNNER_TEMP/openclaw-stable" --no-audit --no-fund --package-lock=false openclaw@2026.10.4

      - name: Verify current stable SDK and packed-plugin compatibility
        working-directory: OpenClawProvider
        env:
          OPENCLAW_HOME: ${{ runner.temp }}/provider-stable-home
          OPENCLAW_STATE_DIR: ${{ runner.temp }}/provider-stable-state
          OPENCLAW_CONFIG_PATH: ${{ runner.temp }}/provider-stable-state/openclaw.json
        run: |
          stable_host="$RUNNER_TEMP/openclaw-stable/node_modules/openclaw"
          node "$stable_host/openclaw.mjs" --version
          ln -sfn "$stable_host" node_modules/openclaw
          pnpm typecheck
          pnpm test
          package_version=$(node -p "require('./package.json').version")
          node "$stable_host/openclaw.mjs" plugins install "npm-pack:$PWD/acedatacloud-openclaw-provider-${package_version}.tgz" --force --accept-capabilities
          node "$stable_host/openclaw.mjs" plugins inspect acedatacloud --runtime --json > stable-runtime-inspect.json
          node scripts/check-runtime.mjs stable-runtime-inspect.json
          node "$stable_host/openclaw.mjs" models list --provider acedatacloud --all --json > stable-models.json
          node -e 'const x = require("./stable-models.json"); if (x.models.length !== 90 || new Set(x.models.map(m => m.key)).size !== 90) process.exit(1)'

      - name: Build and install five independent service plugins
        working-directory: OpenClawProvider
        env:
          SERVICE_PLUGIN_HOST: ${{ runner.temp }}/openclaw-stable/node_modules/openclaw/openclaw.mjs
        run: |
          node scripts/build-service-plugins.mjs
          node scripts/check-service-plugins.mjs
          SERVICE_PLUGIN_CHANNEL=clawhub node scripts/check-service-plugins.mjs
          npm view @acedatacloud/openclaw-provider@2026.10.12 dist --json --registry=https://registry.npmjs.org > provider-public-dist.json

      - name: Verify guarded downloads of existing media
        working-directory: OpenClawProvider
        run: node scripts/verify-public-media.mjs && node scripts/verify-media-adapters.mjs

      - name: Save build and resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: provider-package
          path: |
            OpenClawProvider/*.tgz
            OpenClawProvider/pnpm-lock.yaml
            OpenClawProvider/*runtime-inspect.json
            OpenClawProvider/stable-models.json
            OpenClawProvider/media-download-proof.json
            OpenClawProvider/media-adapter-proof.json
            OpenClawProvider/service-plugin-proof/*.json
            OpenClawProvider/provider-public-dist.json
