name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this plugin
        uses: actions/checkout@v4
        with:
          path: OpenClawProvider

      - name: Checkout openclaw monorepo (for workspace plugin-sdk)
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: main
          path: openclaw
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        working-directory: OpenClawProvider
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        working-directory: OpenClawProvider
        run: pnpm typecheck

      - name: Unit tests
        working-directory: OpenClawProvider
        run: pnpm test

      - name: Build
        working-directory: OpenClawProvider
        run: pnpm build
