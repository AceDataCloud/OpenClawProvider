name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v2026.5.31)'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout this plugin
        uses: actions/checkout@v4
        with:
          path: OpenClawProvider
          ref: ${{ steps.ref.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Install dependencies
        working-directory: OpenClawProvider
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: OpenClawProvider
        run: pnpm typecheck

      - name: Tests
        working-directory: OpenClawProvider
        run: pnpm test

      - name: Verify catalog projections
        working-directory: OpenClawProvider
        run: pnpm sync-catalog:check && pnpm sync-services:check

      - name: Build
        working-directory: OpenClawProvider
        run: pnpm build

      - name: Verify package contents
        working-directory: OpenClawProvider
        run: pnpm pack --pack-destination .

      - name: Check npm publishing availability
        id: npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'npm publication skipped: publishing credentials are not configured. The GitHub package artifact is still published.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to npm
        if: steps.npm-auth.outputs.available == 'true'
        working-directory: OpenClawProvider
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish acedatacloud-openclaw-provider-2026.10.3.tgz --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.ref }}
          name: ${{ steps.ref.outputs.ref }}
          generate_release_notes: true
          files: OpenClawProvider/*.tgz
          fail_on_unmatched_files: true
